<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Meme</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    margin: 0;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  #question {
    font-size: 24px;
    margin-bottom: 20px;
  }

  #yesBtn, #noBtn {
    padding: 20px;
    font-size: 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px;
  }

  #yesBtn {
    background-color: #4CAF50;
    color: white;
  }

  #yesBtn:hover {
    background-color: #45a049;
  }

  #noBtn {
    background-color: #f44336;
    color: white;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: all 0.3s ease;
  }

  #noBtn:hover {
    background-color: #da190b;
  }

  #gifContainer {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
  }

  #finalMeme {
    margin-top: 20px;
    display: none;
    max-width: 80%;
    height: auto;
    border-radius: 10px;
  }
</style>
</head>
<body>

<div class="card">
  <div id="question">¿Quieres seguir jugando?</div>
  <button id="yesBtn">Sí</button>
  <button id="noBtn">No</button>
  <div id="gifContainer"></div>
  <img id="finalMeme" src="" alt="Final Meme" />
</div>

<script>
  const noBtn = document.getElementById('noBtn');
  const gifContainer = document.getElementById('gifContainer');
  const finalMeme = document.getElementById('finalMeme');

  const gifUrls = [
    "https://tenor.com/view/happy-cat-gif-13725053412610276088",
    "https://tenor.com/view/weird-cute-cat-meme-dancing-cat-meme-rawr-gif-12169608540182919744",
    "https://tenor.com/view/p1-gif-4520859952946932427",
    "https://tenor.com/view/cat-hitting-beat-up-gif-8279846698060381944",
    "https://tenor.com/view/cat-gif-14345055558441530836",
    "https://tenor.com/view/cat-gif-7053890032218805381",
    "https://tenor.com/view/cat-gif-2605163403954038415",
    "https://tenor.com/view/cat-cat-rocked-cat-aura-cat-ego-cat-attitude-gif-2728367062656046314" // last meme
  ];

  let noClicks = 0;

  function moveButton() {
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.top = `${y}px`;
    noBtn.style.left = `${x}px`;
  }

  noBtn.addEventListener('click', () => {
    noClicks++;

    // Move the "No" button around
    moveButton();

    // Add a GIF
    const gif = document.createElement('img');
    gif.style.width = '150px';
    gif.style.margin = '10px';

    // Select the appropriate GIF
    let gifIndex = noClicks - 1;
    if (gifIndex >= 7) gifIndex = 7; // last meme for the 8th click

    gif.src = gifUrls[gifIndex];
    gifContainer.appendChild(gif);

    // No removal after 1 second, so the GIF stays visible
    // Optional: you can remove this line if you want the GIFs to stay permanently
    // setTimeout(() => { gif.remove(); }, 3000);

    // Limit to 7 clicks
    if (noClicks >= 7) {
      // Hide the "No" button
      noBtn.style.display = 'none';

      // Show the final meme
      finalMeme.src = gifUrls[7];
      finalMeme.style.display = 'block';
    }
  });
</script>

</body>
</html>
