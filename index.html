<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Dear 💖</title>
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffc3a0, #ffafbd);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.card {
    background: white;
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    text-align: center;
    max-width: 460px;
    position: relative;
    z-index: 2;
    animation: floatCard 4s ease-in-out infinite;
}

@keyframes floatCard {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

h1 {
    color: #ff4b6e;
    margin-bottom: 5px;
}

.subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 15px;
}

#typewriter {
    font-size: 20px;
    font-weight: bold;
    color: #ff4b6e;
    min-height: 28px;
}

#countdown {
    margin-top: 12px;
    font-weight: bold;
    color: #ff4b6e;
}

button {
    padding: 12px 22px;
    margin: 10px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s ease;
}

.yes {
    background-color: #ff4b6e;
    color: white;
}

.yes:hover {
    transform: scale(1.1);
}

.no {
    background-color: #ddd;
}

.hidden {
    display: none;
}

.cat-container {
    margin-top: 20px;
    animation: fadeIn 1s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}

.cat-image {
    width: 260px;
    border-radius: 15px;
    margin-top: 10px;
    cursor: pointer;
}

.final-message {
    margin-top: 15px;
    font-weight: bold;
    color: #ff4b6e;
}

.heart {
    position: fixed;
    bottom: -10px;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 0.7; }
    100% { transform: translateY(-110vh); opacity: 0; }
}

.confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    top: -10px;
    animation: fall 3s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>
<body>

<div class="card">
    <h1>Dear Khelyana 💖</h1>
    <div class="subtitle">(also known as Yannie, professional heart thief)</div>

    <div id="typewriter"></div>

    <div id="countdown"></div>

    <div id="buttonContainer">
        <button id="yesBtn" class="yes" onclick="sayYes()">Yes</button>
        <button id="noBtn" class="no" onclick="sayNo()">No</button>
    </div>

    <div id="afterYes" class="hidden cat-container">
        <div class="final-message">
            I love you so much! Let's go sa photobooth, Pinto Art, and Rob mall ulitt :))
        </div>
        <img class="cat-image" id="cat" src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="Cuddling cats">
        <div><strong>This is us after our date mueheheheh</strong></div>
        <div id="easterEgg" class="hidden final-message">Okay fine maybe we stay 10 minutes longer sa photobooth 😌</div>
    </div>
</div>

<script>
// Typewriter effect
const message = "Will You be my valentine?";
let index = 0;
function typeEffect() {
    if (index < message.length) {
        document.getElementById("typewriter").innerHTML += message.charAt(index);
        index++;
        setTimeout(typeEffect, 70);
    }
}
typeEffect();

// Countdown
const valentinesDate = new Date(2026, 1, 14, 18, 0, 0);
function updateCountdown() {
    const now = new Date().getTime();
    const distance = valentinesDate - now;
    if (distance < 0) {
        document.getElementById("countdown").innerHTML = "It is finally our date day.";
        return;
    }
    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);
    document.getElementById("countdown").innerHTML =
        `Countdown: ${days}d ${hours}h ${minutes}m ${seconds}s`;
}
setInterval(updateCountdown, 1000);

// Button behavior
let yesScale = 1;
let noScale = 1;
let noPressCount = 0;

function sayNo() {
    noPressCount++;
    noScale -= 0.1;
    yesScale += 0.1;
    if (noScale < 0.4) noScale = 0.4;
    document.getElementById("noBtn").style.transform = `scale(${noScale})`;
    document.getElementById("yesBtn").style.transform = `scale(${yesScale})`;
    if (noPressCount >= 30) {
        document.getElementById("noBtn").remove();
    }
}

function createConfetti() {
    for (let i = 0; i < 40; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.background = `hsl(${Math.random()*360}, 80%, 60%)`;
        confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
    }
}

function sayYes() {
    document.getElementById("afterYes").classList.remove("hidden");
    document.getElementById("buttonContainer").remove();
    createConfetti();
}

// Easter egg when clicking the cat

document.addEventListener("click", function(e) {
    if (e.target && e.target.id === "cat") {
        document.getElementById("easterEgg").classList.remove("hidden");
    }
});

// Floating hearts
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => { heart.remove(); }, 6000);
}
setInterval(createHeart, 600);
</script>

</body>
</html>
