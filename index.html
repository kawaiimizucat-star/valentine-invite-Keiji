<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    text-align: center;
    max-width: 420px;
    position: relative;
    z-index: 2;
}

h1 {
    color: #ff4b6e;
}

#countdown {
    margin-top: 15px;
    font-weight: bold;
    color: #ff4b6e;
}

button {
    padding: 12px 22px;
    margin: 10px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s ease;
}

.yes {
    background-color: #ff4b6e;
    color: white;
}

.no {
    background-color: #ddd;
}

.hidden {
    display: none;
    margin-top: 20px;
    font-weight: bold;
    color: #ff4b6e;
}

.heart {
    position: fixed;
    bottom: -10px;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 0.7; }
    100% { transform: translateY(-110vh); opacity: 0; }
}

.cat-image {
    margin-top: 20px;
    width: 250px;
    border-radius: 15px;
}
</style>
</head>
<body>

<div class="card">
    <h1>Hi My Love</h1>
    <p>
        <!-- WRITE YOUR CUSTOM MESSAGE HERE -->
        Replace this with your own message.
    </p>

    <div id="countdown"></div>

    <div>
        <button id="yesBtn" class="yes" onclick="sayYes()">Yes</button>
        <button id="noBtn" class="no" onclick="sayNo()">No</button>
    </div>

    <div id="afterYes" class="hidden">
        I love you so much! Let's go sa photobooth, Pinto Art, and Rob mall ulitt :))
        <br><br>
        <img class="cat-image" src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="Cuddling cats">
        <div>This is us after our date mueheheheh</div>
    </div>
</div>

<script>
// Set your date here (Year, Month-1, Day, Hour, Minute)
const valentinesDate = new Date(2026, 1, 14, 18, 0, 0);

function updateCountdown() {
    const now = new Date().getTime();
    const distance = valentinesDate - now;

    if (distance < 0) {
        document.getElementById("countdown").innerHTML = "It's finally our date day!";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("countdown").innerHTML =
        `Countdown: ${days}d ${hours}h ${minutes}m ${seconds}s`;
}

setInterval(updateCountdown, 1000);

let yesScale = 1;
let noScale = 1;
let noPressCount = 0;

function sayNo() {
    noPressCount++;

    noScale -= 0.1;
    yesScale += 0.1;

    if (noScale < 0.4) noScale = 0.4;

    document.getElementById("noBtn").style.transform = `scale(${noScale})`;
    document.getElementById("yesBtn").style.transform = `scale(${yesScale})`;

    // Remove No button after 30 presses
    if (noPressCount >= 30) {
        const noButton = document.getElementById("noBtn");
        noButton.style.transition = "0.3s";
        noButton.style.opacity = "0";
        setTimeout(() => {
            noButton.remove();
        }, 300);
    }
}

function sayYes() {
    document.getElementById("afterYes").classList.remove("hidden");

    // Hide Yes and No buttons after she presses Yes
    const yesButton = document.getElementById("yesBtn");
    const noButton = document.getElementById("noBtn");

    yesButton.style.transition = "0.3s";
    yesButton.style.opacity = "0";
    yesButton.style.transform = "scale(0.5)";

    if (noButton) {
        noButton.style.opacity = "0";
    }

    setTimeout(() => {
        yesButton.remove();
        if (noButton) noButton.remove();
    }, 300);
}

// Floating hearts
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => { heart.remove(); }, 6000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
