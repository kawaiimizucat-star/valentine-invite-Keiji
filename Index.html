<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 420px;
            position: relative;
            z-index: 2;
        }

        h1 {
            color: #ff4b6e;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 16px;
        }

        #countdown {
            margin-top: 15px;
            font-weight: bold;
            color: #ff4b6e;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .yes {
            background-color: #ff4b6e;
            color: white;
        }

        .yes:hover {
            background-color: #ff1f4b;
        }

        .no {
            background-color: #ddd;
        }

        .hidden-message {
            display: none;
            margin-top: 20px;
            font-weight: bold;
            color: #ff4b6e;
        }

        .heart {
            position: fixed;
            bottom: -10px;
            font-size: 20px;
            animation: floatUp 6s linear infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.7;
            }
            100% {
                transform: translateY(-110vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Hi My Love 💖</h1>
    <p>
        <!-- ✨ WRITE YOUR CUSTOM MESSAGE BELOW ✨ -->
        Replace this text with your own heartfelt message.
    </p>

    <div id="countdown"></div>

    <div class="buttons">
        <button class="yes" onclick="sayYes()">Yes 💕</button>
        <button class="no">No 🙈</button>
    </div>

    <div class="hidden-message" id="message">
        YAY!!! I can't wait for our Valentine's date! 🌹✨
    </div>

    <audio id="bgMusic" loop>
        <!-- 🎵 Replace 'your-song.mp3' with your music file name -->
        <source src="your-song.mp3" type="audio/mpeg">
    </audio>
</div>

<script>
    // 💕 SET YOUR DATE HERE (Year, Month-1, Day, Hour, Minute)
    const valentinesDate = new Date(2026, 1, 14, 18, 0, 0);

    function updateCountdown() {
        const now = new Date().getTime();
        const distance = valentinesDate - now;

        if (distance < 0) {
            document.getElementById("countdown").innerHTML = "It's finally our date day! 💘";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((distance / (1000 * 60)) % 60);
        const seconds = Math.floor((distance / 1000) % 60);

        document.getElementById("countdown").innerHTML =
            `Countdown: ${days}d ${hours}h ${minutes}m ${seconds}s 💞`;
    }

    setInterval(updateCountdown, 1000);

    function sayYes() {
        document.getElementById("message").style.display = "block";
        document.getElementById("bgMusic").play();
    }

    // Floating hearts generator
    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);
    }

    setInterval(createHeart, 500);
</script>

</body>
</html>
